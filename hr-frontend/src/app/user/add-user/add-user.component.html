<app-navbar></app-navbar>

<div class="container mt-4 form-wrapper">
  <!-- Logo Section -->
  <div class="logo-section">
    <img src="assets/logoHR.png" alt="PeopleRecords Logo" class="logo" />
    <h1 class="system-name">PeopleRecords</h1>
  </div>

  <h2>Add New User</h2>

  <form (ngSubmit)="onSubmit()" #userForm="ngForm">
    <!-- Name -->
    <div class="mb-3">
      <label for="name" class="form-label">Full Name</label>
      <input
        id="name"
        type="text"
        class="form-control"
        name="name"
        [(ngModel)]="userData.name"
        required
        maxlength="100"
      />
      <div *ngIf="userForm.submitted && !userData.name" class="error">
        <small>Name is required.</small>
      </div>
    </div>

    <!-- Email -->
    <div class="mb-3">
      <label for="email" class="form-label">Email Address</label>
      <input
        id="email"
        type="email"
        class="form-control"
        name="email"
        [(ngModel)]="userData.email"
        required
      />
      <div *ngIf="userForm.submitted && !userData.email" class="error">
        <small>Email is required.</small>
      </div>
    </div>

    <!-- Actions -->
    <div class="mt-3">
      <button
        type="submit"
        class="btn btn-success me-2"
        [disabled]="userForm.invalid"
      >
        Add User
      </button>
      <button type="button" class="btn btn-secondary" routerLink="/users">
        Cancel
      </button>
    </div>
  </form>
</div>
